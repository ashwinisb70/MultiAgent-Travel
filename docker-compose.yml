version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tripgenie-postgres
    environment:
      POSTGRES_USER: tripgenie
      POSTGRES_PASSWORD: tripgenie
      POSTGRES_DB: tripgenie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripgenie"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tripgenie-backend
    environment:
      DATABASE_URL: postgresql://tripgenie:tripgenie@postgres:5432/tripgenie_db
      SECRET_KEY: dev-secret-key-change-in-production
      LLM_PROVIDER: demo
      USE_DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tripgenie-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    command: npm run dev

volumes:
  postgres_data:

networks:
  default:
    name: tripgenie-network
